api_version: 1
enabled: true
description: Read-only world snapshot of self, nearby units, and the current target
compose:
  file: compose.yaml
  service: module
grpc:
  descriptor_set: module.pb
rpc:
  get_self: /sense.module.v1.Module/GetSelf
  get_skills: /sense.module.v1.Module/GetSkills
  get_nearby: /sense.module.v1.Module/GetNearby
  get_target: /sense.module.v1.Module/GetTarget
  select_target: /sense.module.v1.Module/SelectTarget
  clear_target: /sense.module.v1.Module/ClearTarget
  query_name: /sense.module.v1.Module/QueryName
  get_played_time: /sense.module.v1.Module/GetPlayedTime
  status: /sense.module.v1.Module/Status
  debug_monster_moves: /sense.module.v1.Module/DebugMonsterMoves
  debug_fields: /sense.module.v1.Module/DebugFields
packets:
  SMSG_LOGIN_VERIFY_WORLD: /sense.module.v1.Module/OnPacket
  SMSG_NEW_WORLD: /sense.module.v1.Module/OnPacket
  SMSG_UPDATE_OBJECT: /sense.module.v1.Module/OnPacket
  SMSG_COMPRESSED_UPDATE_OBJECT: /sense.module.v1.Module/OnPacket
  SMSG_DESTROY_OBJECT: /sense.module.v1.Module/OnPacket
  SMSG_NAME_QUERY_RESPONSE: /sense.module.v1.Module/OnPacket
  SMSG_CREATURE_QUERY_RESPONSE: /sense.module.v1.Module/OnPacket
  SMSG_MONSTER_MOVE: /sense.module.v1.Module/OnPacket
  SMSG_SPELL_COOLDOWN: /sense.module.v1.Module/OnPacket
  SMSG_COOLDOWN_EVENT: /sense.module.v1.Module/OnPacket
  SMSG_AURA_UPDATE: /sense.module.v1.Module/OnPacket
  SMSG_AURA_UPDATE_ALL: /sense.module.v1.Module/OnPacket
  SMSG_UPDATE_COMBO_POINTS: /sense.module.v1.Module/OnPacket
  SMSG_PLAYED_TIME: /sense.module.v1.Module/OnPacket
