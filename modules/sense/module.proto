syntax = "proto3";

package sense.module.v1;
option go_package = "github.com/doumoman/agent-wow-mods/sense/src/api;modulev1";

import "api/module/v1/session.proto";
import "google/protobuf/empty.proto";

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Unit {
  uint64 guid = 1;
  string name = 2;
  // ObjectType from the create block: 3 unit, 4 player.
  uint32 type = 3;
  Vector3 position = 4;
  float orientation = 5;
  bool has_position = 6;
  uint32 health = 7;
  uint32 max_health = 8;
  uint32 level = 9;
  uint32 class_id = 10;
  uint32 race_id = 11;
  uint64 target_guid = 12;
  bool is_self = 13;
  uint32 entry = 14;
  // Player progression; only self carries these.
  uint32 xp = 15;
  uint32 next_level_xp = 16;
  // UNIT_FIELD_FLAGS (bit 0x80000 is in combat) and PLAYER_FLAGS (bit 0x10 is ghost).
  uint32 flags = 17;
  uint32 player_flags = 18;
  bool dead = 19;
  uint32 faction = 20;
  bool in_combat = 21;
  // Copper carried by the character (PLAYER_FIELD_COIN1).
  uint64 money = 22;
  // Primary power type from UNIT_FIELD_BYTES_0 byte 3: 0 mana, 1 rage,
  // 2 focus, 3 energy, 4 happiness, 5 rune, 6 runic power.
  uint32 power_type = 23;
  // Current and maximum primary power, read from the slot for power_type.
  uint32 power = 24;
  uint32 max_power = 25;
  uint32 display_id = 26;
  // UNIT_DYNAMIC_FLAGS low byte (lootable/skinnable/tagged) and UNIT_NPC_FLAGS
  // low bytes (gossip, questgiver, vendor, trainer, spirit healer).
  uint32 dynamic_flags = 27;
  uint32 npc_flags = 28;
  // Visible aura slots reported for this unit. Empty until an aura packet for
  // the unit arrives.
  repeated Aura auras = 29;
}

// Aura is one visible aura slot. spell_id zero means the slot was cleared.
message Aura {
  uint32 slot = 1;
  uint32 spell_id = 2;
  uint32 flags = 3;
  uint32 caster_level = 4;
  uint32 stacks = 5;
  uint64 caster_guid = 6;
  bool has_caster = 7;
  uint32 max_duration_ms = 8;
  uint32 duration_ms = 9;
  bool has_duration = 10;
  bool positive = 11;
  bool negative = 12;
}

// Cooldown is one server-reported spell cooldown. cooldown_ms is the duration
// the server applied; remaining_ms is computed from the module's receipt time.
message Cooldown {
  uint32 spell_id = 1;
  uint32 cooldown_ms = 2;
  uint32 remaining_ms = 3;
}

// GameObject is a visible game object (herb/mining node, quest object, door,
// chest) from the create block and game object update fields.
message GameObject {
  uint64 guid = 1;
  uint32 entry = 2;
  uint32 type_id = 3;
  uint32 display_id = 4;
  uint32 flags = 5;
  uint32 state = 6;
  uint32 anim_progress = 7;
  uint32 level = 8;
  uint32 faction = 9;
  Vector3 position = 10;
  float orientation = 11;
  bool has_position = 12;
}

// Skill is one skill line of the character, decoded from the player's own
// skill block. The name comes from the client data skill line table.
message Skill {
  uint32 id = 1;
  string name = 2;
  // Skill line category; 11 is the profession category.
  uint32 category = 3;
  uint32 value = 4;
  uint32 max = 5;
  // Skill step the rank has reached.
  uint32 step = 6;
  bool profession = 7;
}

message SelfResponse {
  Unit unit = 1;
  uint32 map_id = 2;
  bool in_world = 3;
  // Skill lines of the character, professions included.
  repeated Skill skills = 4;
  // State epoch. It increments on every SMSG_LOGIN_VERIFY_WORLD and every
  // SMSG_NEW_WORLD (map transition), invalidating cursors, GUIDs and position
  // assumptions from the previous epoch.
  uint64 epoch = 5;
  // Ready is the cold-start gate for this epoch: the character has entered the
  // world, a map is known, and the first post-transition update carried the
  // self health, max health, level, class/power type and primary power fields.
  // It is derived from server packets, never set by the caller.
  bool ready = 6;
  // Number of map transitions observed in this process.
  uint32 map_changes = 7;
  // Has_map distinguishes a known map id from the valid map 0 (Eastern
  // Kingdoms).
  bool has_map = 8;
  repeated Aura auras = 9;
  repeated Cooldown cooldowns = 10;
  // Combo points and their target (SMSG_UPDATE_COMBO_POINTS). Zero points or
  // a zero target mean no active combo.
  uint32 combo_points = 11;
  uint64 combo_target_guid = 12;
  // Top-level identity of the character this module is attached to. These
  // duplicate unit.guid/unit.name so a cold-start gate can validate the
  // session from the snapshot root without flattening nested messages.
  uint64 guid = 13;
  string name = 14;
}

message SkillsResponse {
  repeated Skill skills = 1;
}

message NearbyRequest {
  // Zero means no distance filter.
  float radius = 1;
  // Zero means the default of 32 units, capped at 200. The cap applies to
  // units and game objects separately.
  uint32 limit = 2;
  // Include game objects (nodes, quest objects, doors, chests). Off by
  // default so existing unit-only callers keep their ordering and size.
  bool include_game_objects = 3;
}

message NearbyResponse {
  repeated Unit units = 1;
  uint32 known_units = 2;
  repeated GameObject game_objects = 3;
  uint32 known_game_objects = 4;
}

message TargetResponse {
  bool has_target = 1;
  uint64 target_guid = 2;
  Unit unit = 3;
  // Game_object is set when the current selection is a game object rather
  // than a unit/player.
  GameObject game_object = 4;
}

message SelectTargetRequest {
  uint64 guid = 1;
}

message QueryNameRequest {
  uint64 guid = 1;
}

// PlayedTimeResponse reports the server's played-time counters, the same
// numbers the client's /played command prints. Total is cumulative across all
// sessions; Level is the time spent at the current level. Session is measured
// by this module from the login that started the current process.
message PlayedTimeResponse {
  // False until the server has answered CMSG_PLAYED_TIME at least once.
  bool has_data = 1;
  uint32 total_seconds = 2;
  uint32 level_seconds = 3;
  // Seconds since this module entered the world (the current session).
  uint32 session_seconds = 4;
  // Unix seconds when the current session started.
  uint64 session_started_unix = 5;
  // Unix milliseconds when the server last answered CMSG_PLAYED_TIME.
  uint64 sampled_unix_ms = 6;
}

message StatusResponse {
  uint32 packets = 1;
  uint32 parse_errors = 2;
  uint32 known_units = 3;
  uint32 name_queries = 4;
  uint32 creature_queries = 5;
  uint64 epoch = 6;
  bool ready = 7;
  uint32 map_id = 8;
  uint32 map_changes = 9;
  uint32 aura_updates = 10;
  uint32 cooldown_packets = 11;
  uint32 cooldown_events = 12;
}

// MonsterMoveSamples returns recent SMSG_MONSTER_MOVE payloads as hex so the
// wire layout can be verified against the live server.
message MonsterMoveSamples {
  repeated string payloads = 1;
}

// FieldSlot is one raw update-field slot captured for the character.
message FieldSlot {
  uint32 index = 1;
  uint32 value = 2;
}

// FieldDump lists the raw update-field slots seen for the character, so a new
// field offset can be identified against the live server before it is named.
message FieldDump {
  repeated FieldSlot slots = 1;
}

service Module {
  rpc GetSelf(google.protobuf.Empty) returns (SelfResponse);
  // GetSkills returns the character's skill lines without the rest of the
  // character snapshot.
  rpc GetSkills(google.protobuf.Empty) returns (SkillsResponse);
  rpc GetNearby(NearbyRequest) returns (NearbyResponse);
  rpc GetTarget(google.protobuf.Empty) returns (TargetResponse);
  // SelectTarget sends CMSG_SET_SELECTION and remembers the choice because the
  // server never echoes the client's own selection.
  rpc SelectTarget(SelectTargetRequest) returns (google.protobuf.Empty);
  rpc ClearTarget(google.protobuf.Empty) returns (google.protobuf.Empty);
  // QueryName asks the server for a player/pet name; the answer is async.
  rpc QueryName(QueryNameRequest) returns (google.protobuf.Empty);
  // GetPlayedTime returns the last known played time. It never blocks on the
  // server: a stale sample triggers an asynchronous CMSG_PLAYED_TIME.
  rpc GetPlayedTime(google.protobuf.Empty) returns (PlayedTimeResponse);
  rpc Status(google.protobuf.Empty) returns (StatusResponse);
  rpc DebugMonsterMoves(google.protobuf.Empty) returns (MonsterMoveSamples);
  rpc DebugFields(google.protobuf.Empty) returns (FieldDump);
  rpc OnPacket(agentwow.module.v1.WorldPacket) returns (google.protobuf.Empty);
}
