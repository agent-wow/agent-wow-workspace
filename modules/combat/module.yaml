api_version: 1
enabled: true
description: Melee attack, abilities, and combat/progression state
compose:
  file: compose.yaml
  service: module
grpc:
  descriptor_set: module.pb
rpc:
  attack: /combat.module.v1.Module/Attack
  stop_attack: /combat.module.v1.Module/StopAttack
  cast: /combat.module.v1.Module/Cast
  release_spirit: /combat.module.v1.Module/ReleaseSpirit
  reclaim_corpse: /combat.module.v1.Module/ReclaimCorpse
  resurrect_at_spirit_healer: /combat.module.v1.Module/ResurrectAtSpiritHealer
  get_state: /combat.module.v1.Module/GetState
  get_spells: /combat.module.v1.Module/GetSpells
  status: /combat.module.v1.Module/Status
packets:
