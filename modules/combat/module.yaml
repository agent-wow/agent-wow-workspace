  SMSG_ATTACKSWING_CANT_ATTACK: /combat.module.v1.Module/OnPacket
  SMSG_LOG_XPGAIN: /combat.module.v1.Module/OnPacket
  SMSG_LEVELUP_INFO: /combat.module.v1.Module/OnPacket
  SMSG_CAST_FAILED: /combat.module.v1.Module/OnPacket
  SMSG_INITIAL_SPELLS: /combat.module.v1.Module/OnPacket
  SMSG_LEARNED_SPELL: /combat.module.v1.Module/OnPacket
  SMSG_GOSSIP_MESSAGE: /combat.module.v1.Module/OnPacket
  SMSG_SPIRIT_HEALER_CONFIRM: /combat.module.v1.Module/OnPacket
  SMSG_CORPSE_RECLAIM_DELAY: /combat.module.v1.Module/OnPacket
  SMSG_DEATH_RELEASE_LOC: /combat.module.v1.Module/OnPacket
  SMSG_UPDATE_OBJECT: /combat.module.v1.Module/OnPacket
