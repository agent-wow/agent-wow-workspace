  SMSG_NEW_WORLD: /combat.module.v1.Module/OnPacket
  SMSG_ATTACKSTART: /combat.module.v1.Module/OnPacket
  SMSG_ATTACKSTOP: /combat.module.v1.Module/OnPacket
  SMSG_ATTACKSWING_NOTINRANGE: /combat.module.v1.Module/OnPacket
  SMSG_ATTACKSWING_BADFACING: /combat.module.v1.Module/OnPacket
