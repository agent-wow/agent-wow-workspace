syntax = "proto3";

package inventory.module.v1;
option go_package = "github.com/doumoman/agent-wow-mods/inventory/src/api;modulev1";

import "api/module/v1/session.proto";
import "google/protobuf/empty.proto";

message Item {
  uint64 guid = 1;
  uint32 item_id = 2;
  string name = 3;
  uint32 quality = 4;
  uint32 class_id = 5;
  uint32 subclass = 6;
  uint32 inventory_type = 7;
  int32 equipment_slot = 8;
  uint32 required_level = 9;
  uint32 required_class_mask = 10;
  uint32 required_skill = 11;
  uint32 required_skill_rank = 12;
  map<string, int32> stats = 13;
  uint32 armor = 14;
  double dps = 15;
  uint32 sell_price = 16;
  int64 buy_price = 17;
  uint32 count = 18;
  uint32 bag = 19;
  uint32 slot = 20;
  uint32 container_slots = 21;
  bool equipped = 22;
  bool quest_item = 23;
  int32 stock = 24;
  uint32 durability = 25;
  uint32 max_durability = 26;
  bool template_known = 27;
  uint32 bonding = 28;
}

message Failure {
  string operation = 1;
  uint32 result = 2;
  uint64 item_guid = 3;
  uint32 item_id = 4;
  uint32 required_level = 5;
  string detail = 6;
}

message InventoryState {
  repeated Item items = 1;
  repeated Item vendor_items = 2;
  repeated Item buyback = 3;
  uint32 money = 4;
  uint32 free_slots = 5;
  uint64 vendor_guid = 6;
  Failure last_failure = 7;
  uint32 failure_count = 8;
  uint32 item_queries = 9;
  uint32 parse_errors = 10;
  bool vendor_loaded = 11;
  uint64 revision = 12;
  TradeState trade = 13;
  repeated Item item_templates = 14;
}

message VendorRequest { uint64 vendor_guid = 1; }
message ItemQuery { uint32 item_id = 1; }
message BuyRequest {
  uint64 vendor_guid = 1;
  uint32 item_id = 2;
  uint32 slot = 3;
  uint32 count = 4;
}
message SellRequest {
  uint64 vendor_guid = 1;
  uint64 item_guid = 2;
  uint32 count = 3;
}
message RepairRequest {
  uint64 vendor_guid = 1;
  uint64 item_guid = 2;
  bool use_guild_bank = 3;
}
message EquipRequest {
  uint64 item_guid = 1;
  uint32 destination_slot = 2;
}
message BuybackRequest {
  uint64 vendor_guid = 1;
  uint32 slot = 2;
}

message TradeItem {
  uint32 slot = 1;
  uint32 item_id = 2;
  uint32 count = 3;
  int32 random_property = 4;
}

message TradeState {
  uint32 trade_id = 1;
  uint64 revision = 2;
  bool pending = 3;
  bool active = 4;
  uint64 trader_guid = 5;
  bool own_accepted = 6;
  bool trader_accepted = 7;
  bool complete = 8;
  bool cancelled = 9;
  uint32 last_status = 10;
  uint32 close_result = 11;
  repeated TradeItem own_items = 12;
  repeated TradeItem trader_items = 13;
  uint32 own_money = 14;
  uint32 trader_money = 15;
}

message TradeRequest {
  string action = 1;
  uint32 trade_id = 2;
  uint64 expected_revision = 3;
  uint64 target_guid = 4;
  uint32 trade_slot = 5;
  uint32 bag = 6;
  uint32 slot = 7;
  uint64 item_guid = 8;
  uint32 copper = 9;
}

service Module {
  rpc GetState(google.protobuf.Empty) returns (InventoryState);
  rpc ListInventory(VendorRequest) returns (InventoryState);
  rpc Buy(BuyRequest) returns (InventoryState);
  rpc Sell(SellRequest) returns (InventoryState);
  rpc Repair(RepairRequest) returns (InventoryState);
  rpc Equip(EquipRequest) returns (InventoryState);
  rpc Buyback(BuybackRequest) returns (InventoryState);
  rpc Trade(TradeRequest) returns (InventoryState);
  rpc QueryItem(ItemQuery) returns (InventoryState);
  rpc OnPacket(agentwow.module.v1.WorldPacket) returns (google.protobuf.Empty);
}
